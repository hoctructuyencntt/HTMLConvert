    <style>
        body, html {
            height: 100%;
            margin: 0;
            font-family: Arial, sans-serif;
        }
        .container {
            display: flex;
            flex-direction: column;
            height: 100%;
        }
        .toolbar {
            padding: 10px;
            background: #f4f4f4;
            border-bottom: 1px solid #ccc;
            display: flex;
            justify-content: space-between;
        }
        .editor-container {
            flex: 1;
            padding: 10px;
        }
        .export-button, .template-select {
            padding: 10px;
            background: #4CAF50;
            color: white;
            border: none;
            cursor: pointer;
        }
        .template-select {
            margin-right: 10px;
        }
        .vertical-nav {
            background-color: #333;
            color: white;
            padding: 10px;
            width: 200px;
            height: 100vh;
            position: fixed;
        }
        .vertical-nav a {
            display: block;
            color: white;
            padding: 10px;
            text-decoration: none;
        }
        .vertical-nav a:hover {
            background-color: #575757;
        }
        header {
            background-color: #f4f4f4;
            padding: 20px;
            text-align: center;
            border-bottom: 1px solid #ccc;
            margin-left: 200px;
        }
        footer {
            background-color: #333;
            color: white;
            text-align: center;
            padding: 10px;
            position: fixed;
            bottom: 0;
            width: calc(100% - 200px);
            margin-left: 200px;
        }
        .main-content {
            display: flex;
            margin-left: 200px;
            padding: 20px;
        }
        .content {
            flex: 1;
            padding: 20px;
        }
        .sidebar {
            background-color: #f4f4f4;
            padding: 20px;
            width: 250px;
            border-left: 1px solid #ccc;
        }

   .cke_button__insertequation_icon {
        background-image: url('equation.png') !important;
        background-size: 16px 16px !important;
        background-repeat: no-repeat !important;
        background-position: center center !important;
}
    </style>
</head>

function loadTemplate() {
    const selectedTemplate = document.getElementById('template-select').value;
    const downloadBtn = document.getElementById('download-button');

    if (selectedTemplate === 'default' || selectedTemplate === 'vertical-nav') {
        CKEDITOR.instances.editor.setData(templates[selectedTemplate]);
        downloadBtn.style.display = 'inline-block';
    } else if (selectedTemplate === 'upload') {
        downloadBtn.style.display = 'none';
        document.getElementById('upload-file').click(); // Mở hộp thoại chọn file
    } else if (selectedTemplate === '') {
        // Khi chọn "Select a Template"
        CKEDITOR.instances.editor.setData(''); // Xóa nội dung CKEditor
        downloadBtn.style.display = 'none';
    }
}

function handleFileUpload(event) {
    const file = event.target.files[0];
    if (file) {
        const reader = new FileReader();
        reader.onload = function(e) {
            const content = e.target.result;
            CKEDITOR.instances.editor.setData(content);
        };
        reader.readAsText(file);
    }
}

function downloadFile() {
    // Thay đổi URL này thành đường dẫn file cố định bạn muốn
    const fileUrl = "https://hoctructuyencntt.github.io/HTMLConvert/Script.rar";  // <== sửa link này theo ý bạn
    const fileName = fileUrl.split('/').pop();

    const a = document.createElement('a');
    a.href = fileUrl;
    a.download = fileName;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
}


function exportToHTML() {
            var html = CKEDITOR.instances.editor.getData();
            var blob = new Blob([html], { type: 'text/html' });
            var url = URL.createObjectURL(blob);
            var a = document.createElement('a');
            a.href = url;
            a.download = 'document.html';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        }
