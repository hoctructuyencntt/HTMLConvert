 text-decoration: none;

function generateSidebar(chapterCount, sectionCount, subCount) {
    let html = `<h2>Chapters</h2>\n<ul>\n`;

    for (let c = 1; c <= chapterCount; c++) {
        html += `<li>
    <input type="checkbox" id="ch${c}" hidden checked>
    <label for="ch${c}">Chapter ${String(c).padStart(2, '0')}</label>
    <ul class="section">\n`;

        for (let s = 1; s <= sectionCount; s++) {
            html += `<li>
        <input type="checkbox" id="ch${c}-sec${s}" hidden checked>
        <label for="ch${c}-sec${s}"><a href="#${c}.${s}">${c}.${s}. Section</a></label>
        <ul class="subsection">\n`;

            for (let ss = 1; ss <= subCount; ss++) {
                html += `<li><a href="#${c}.${s}.${ss}">${c}.${s}.${ss}. Subsection</a></li>\n`;
            }

            html += `</ul></li>\n`;
        }

        html += `</ul></li>\n`;
    }

    html += `</ul>`;
    return html;
}
function generateChapterText(chapterCount) {
    let html = "";
    for (let c = 1; c <= chapterCount; c++) {
        html += `<h2 id="${c}">Chapter ${c}</h2>\n<p>Nội dung chương ${c} ở đây.</p>\n`;
    }
    return html;
}

function loadTemplate() {
    const selectedTemplate = document.getElementById('template-select').value;
    const downloadBtn = document.getElementById('download-button');

    const numChapters = parseInt(document.getElementById('num-chapters').value, 10);
    const numSections = parseInt(document.getElementById('num-sections').value, 10);
    const numSubsections = parseInt(document.getElementById('num-subsections').value, 10);

    if (!selectedTemplate || !templates[selectedTemplate]) {
        CKEDITOR.instances.editor.setData('');
        downloadBtn.style.display = 'none';
        return;
    }

    const parser = new DOMParser();
    const doc = parser.parseFromString(templates[selectedTemplate], 'text/html');

    const sidebarHtml = generateSidebar(numChapters, numSections, numSubsections);
    const chapterTextHtml = generateChapterText(numChapters);

    // Chèn vào layout tương ứng
    if (selectedTemplate === 'default') {
        const sidebar = doc.querySelector('.chapter-sidebar');
        const chapterText = doc.querySelector('#chapter-text');
        if (sidebar) sidebar.innerHTML = sidebarHtml;
        if (chapterText) chapterText.innerHTML = chapterTextHtml;
    } else if (selectedTemplate === 'vertical-nav') {
        const sidebar = doc.querySelector('.sidebar');
        const chapterText = doc.querySelector('#chapter-text');
        if (sidebar) sidebar.innerHTML = sidebarHtml;
        if (chapterText) chapterText.innerHTML = chapterTextHtml;
    }

    CKEDITOR.instances.editor.setData(doc.documentElement.outerHTML);
    downloadBtn.style.display = 'inline-block';
}

function handleFileUpload(event) {
    const file = event.target.files[0];
    if (!file) return;

    const fileName = file.name.toLowerCase();
    const reader = new FileReader();

    // Chèn nội dung vào đúng vùng nội dung của template đang dùng
    function updateEditorContent(contentHtml) {
        const editor = CKEDITOR.instances.editor;
        const parser = new DOMParser();
        const doc = parser.parseFromString(editor.getData(), 'text/html');

        const contentContainer =
            doc.querySelector('#chapter-text') ||
            doc.querySelector('#chapter-content-display') ||
            doc.querySelector('.main-content') ||
            doc.body;

        contentContainer.innerHTML = contentHtml;

        editor.setData(doc.documentElement.outerHTML);
    }

    // Xử lý file Word
    if (fileName.endsWith('.docx')) {
        reader.onload = function (e) {
            mammoth.convertToHtml({ arrayBuffer: e.target.result })
                .then(function (result) {
                    updateEditorContent(result.value);
                })
                .catch(function (err) {
                    alert("Lỗi khi đọc file Word: " + err.message);
                });
        };
        reader.readAsArrayBuffer(file);
    }

    // Xử lý file PDF
    else if (fileName.endsWith('.pdf')) {
        reader.onload = function (e) {
            const typedarray = new Uint8Array(e.target.result);
            pdfjsLib.getDocument({ data: typedarray }).promise.then(function (pdf) {
                const promises = [];
                for (let i = 1; i <= pdf.numPages; i++) {
                    promises.push(
                        pdf.getPage(i).then(page =>
                            page.getTextContent().then(textContent =>
                                textContent.items.map(item => item.str).join(' ')
                            )
                        )
                    );
                }

                Promise.all(promises).then(function (texts) {
                    const fullText = texts.join('<br><br>');
                    const html = `<div style="white-space: pre-line;">${fullText}</div>`;
                    updateEditorContent(html);
                });
            });
        };
        reader.readAsArrayBuffer(file);
    }

    // Xử lý file HTML
    else if (fileName.endsWith('.html') || fileName.endsWith('.htm')) {
        reader.onload = function (e) {
            CKEDITOR.instances.editor.setData(e.target.result);
        };
        reader.readAsText(file);
    }

    else {
        alert("Chỉ hỗ trợ .docx, .pdf và .html");
    }
}







function downloadFile() {
    // Thay đổi URL này thành đường dẫn file cố định bạn muốn
    const fileUrl = "https://hoctructuyencntt.github.io/HTMLConvert/Script.rar";  // <== sửa link này theo ý bạn
    const fileName = fileUrl.split('/').pop();

    const a = document.createElement('a');
    a.href = fileUrl;
    a.download = fileName;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
}


function exportToHTML() {
    let html = CKEDITOR.instances.editor.getData();

    // Tìm các đoạn như <!--<script ...></script>--> và chỉ loại bỏ <!-- và -->
    html = html.replace(/<!--\s*(<script[\s\S]*?<\/script>)\s*-->/g, '$1');

    const blob = new Blob([html], { type: 'text/html' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'document.html';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
}
